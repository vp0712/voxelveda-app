<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee ID | Voxel Veda</title><link rel="stylesheet" href="/style.css"><style>
.id-shell{max-width:980px;margin:5vh auto;padding:20px}.id-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.id-card{width:540px;min-height:330px;border-radius:24px;padding:28px;background:linear-gradient(145deg,#08111f,#121d2d);border:1px solid #334155;box-shadow:0 24px 70px #0008;position:relative;overflow:hidden}.id-head{display:flex;justify-content:space-between;align-items:center}.id-logo{width:150px;max-height:60px;object-fit:contain}.id-chip{font-size:11px;letter-spacing:.12em;border:1px solid #475569;border-radius:999px;padding:7px 10px}.id-name{font-size:30px;font-weight:800;margin:34px 0 5px}.id-role{font-size:16px;opacity:.8}.id-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.id-meta small{display:block;opacity:.55}.id-qr{position:absolute;right:26px;bottom:24px;width:108px;height:108px;background:white;padding:5px;border-radius:10px}.id-status{margin-top:15px;font-weight:700}.muted{opacity:.65}@media print{body *{visibility:hidden}.id-card,.id-card *{visibility:visible}.id-card{position:absolute;left:0;top:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.id-toolbar,.page-title{display:none}}@media(max-width:620px){.id-card{width:auto}.id-meta{grid-template-columns:1fr}.id-qr{position:static;margin-top:20px}}
</style></head><body><main class="id-shell"><h1 class="page-title">Voxel Veda Employee ID Cards</h1><div class="id-toolbar"><a href="/admin?view=staff">Back to Staff</a></div><section id="directory"><p class="muted">Loading active employee ID cards…</p></section><section id="card" class="id-card" hidden><div class="id-head"><img class="id-logo" src="/voxel-veda-logo.png" alt="Voxel Veda"><span class="id-chip">EMPLOYEE ID</span></div><div id="name" class="id-name">Loading…</div><div id="role" class="id-role"></div><div class="id-meta"><div><small>Employee number</small><strong id="number">—</strong></div><div><small>Department</small><strong id="department">—</strong></div><div><small>Issued</small><strong id="issued">—</strong></div><div><small>Expires</small><strong id="expires">—</strong></div></div><img id="qr" class="id-qr" alt="Verification QR" hidden><div id="status" class="id-status"></div></section><div id="cardActions" class="id-toolbar" hidden><button onclick="window.print()">Print / Save PDF</button><button onclick="location.href='/employee-id'">All Active Cards</button></div><p class="muted">Scan the QR code to verify the current credential. Private HR information is not embedded in the QR code.</p></main><script>
const qs=new URLSearchParams(location.search),id=qs.get('user'),set=(x,v)=>document.getElementById(x).textContent=v||'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadCard(userId){document.getElementById('directory').hidden=true;document.getElementById('card').hidden=false;document.getElementById('cardActions').hidden=false;try{const r=await fetch('/api/employee-identities/'+encodeURIComponent(userId)+'/card',{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load card');set('name',d.employee.name);set('role',d.employee.role);set('number',d.employee.employee_number);set('department',d.employee.department);set('issued',d.card.issued_at?new Date(d.card.issued_at).toLocaleDateString():'Not issued');set('expires',d.card.expires_at?new Date(d.card.expires_at).toLocaleDateString():'No expiry');set('status',d.card.status);if(d.card.qr_data_url){const q=document.getElementById('qr');q.src=d.card.qr_data_url;q.hidden=false}}catch(e){set('name','Unable to load ID');set('status',e.message)}}
async function loadDirectory(){try{const r=await fetch('/api/employee-identities',{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load employees');const active=(d.employees||[]).filter(e=>Number(e.active)===1&&!['TERMINATED','SUSPENDED','DISABLED'].includes(String(e.account_status||'').toUpperCase()));document.getElementById('directory').innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">'+active.map(e=>'<a href="/employee-id?user='+encodeURIComponent(e.user_id)+'" style="display:block;padding:18px;border:1px solid #334155;border-radius:16px;text-decoration:none;background:#0b1422"><strong style="font-size:18px">'+esc(e.name)+'</strong><div class="muted">'+esc(e.employee_number||'Employee ID pending')+' · '+esc(e.role||'Staff')+'</div><div class="id-status">'+esc(e.effective_card_status||'ACTIVE')+'</div><div style="margin-top:10px">View / Print ID →</div></a>').join('')+'</div><p class="muted" style="margin-top:16px">'+active.length+' active user ID card'+(active.length===1?'':'s')+'</p>'}catch(e){document.getElementById('directory').innerHTML='<p class="id-status">'+esc(e.message)+'</p>'}}
if(id)loadCard(id);else loadDirectory();
</script></body></html>
