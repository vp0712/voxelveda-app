<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee ID | Voxel Veda</title><link rel="stylesheet" href="/style.css"><style>
.id-shell{max-width:980px;margin:5vh auto;padding:20px}.id-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.id-card{width:540px;min-height:330px;border-radius:24px;padding:28px;background:linear-gradient(145deg,#08111f,#121d2d);border:1px solid #334155;box-shadow:0 24px 70px #0008;position:relative;overflow:hidden}.id-head{display:flex;justify-content:space-between;align-items:center}.id-logo{width:150px;max-height:60px;object-fit:contain}.id-chip{font-size:11px;letter-spacing:.12em;border:1px solid #475569;border-radius:999px;padding:7px 10px}.id-name{font-size:30px;font-weight:800;margin:34px 0 5px}.id-role{font-size:16px;opacity:.8}.id-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.id-meta small{display:block;opacity:.55}.id-qr{position:absolute;right:26px;bottom:24px;width:108px;height:108px;background:white;padding:5px;border-radius:10px}.id-status{margin-top:15px;font-weight:700}.muted{opacity:.65}@media print{body *{visibility:hidden}.id-card,.id-card *{visibility:visible}.id-card{position:absolute;left:0;top:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.id-toolbar,.page-title{display:none}}@media(max-width:620px){.id-card{width:auto}.id-meta{grid-template-columns:1fr}.id-qr{position:static;margin-top:20px}}
</style></head><body><main class="id-shell"><h1 class="page-title">Voxel Veda Employee ID</h1><div class="id-toolbar"><button onclick="window.print()">Print / Save PDF</button><a href="/admin?view=staff">Back to Staff</a></div><section id="card" class="id-card"><div class="id-head"><img class="id-logo" src="/voxel-veda-logo.png" alt="Voxel Veda"><span class="id-chip">EMPLOYEE ID</span></div><div id="name" class="id-name">Loading…</div><div id="role" class="id-role"></div><div class="id-meta"><div><small>Employee number</small><strong id="number">—</strong></div><div><small>Department</small><strong id="department">—</strong></div><div><small>Issued</small><strong id="issued">—</strong></div><div><small>Expires</small><strong id="expires">—</strong></div></div><img id="qr" class="id-qr" alt="Verification QR" hidden><div id="status" class="id-status"></div></section><p class="muted">Scan the QR code to verify the current credential. Private HR information is not embedded in the QR code.</p></main><script>
const id=new URLSearchParams(location.search).get('user');const set=(x,v)=>document.getElementById(x).textContent=v||'—';
if(!id){set('name','Employee not selected');}else fetch('/api/employee-identities/'+encodeURIComponent(id)+'/card',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw new Error((await r.json()).message||'Unable to load card');return r.json()}).then(d=>{set('name',d.employee.name);set('role',d.employee.role);set('number',d.employee.employee_number);set('department',d.employee.department);set('issued',d.card.issued_at?new Date(d.card.issued_at).toLocaleDateString():'Not issued');set('expires',d.card.expires_at?new Date(d.card.expires_at).toLocaleDateString():'No expiry');set('status',d.card.status);if(d.card.qr_data_url){const q=document.getElementById('qr');q.src=d.card.qr_data_url;q.hidden=false}}).catch(e=>{set('name','Unable to load ID');set('status',e.message)});
</script></body></html>
