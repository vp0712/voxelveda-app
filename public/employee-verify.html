<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee ID Verification | Voxel Veda</title><link rel="stylesheet" href="/style.css"><style>.verify-wrap{max-width:720px;margin:8vh auto;padding:24px}.verify-card{padding:32px;border:1px solid #334155;border-radius:22px;background:#0b1220}.verify-status{font-size:1.2rem;font-weight:800;margin:20px 0}.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.verify-field{padding:14px;border-radius:12px;background:#111827}.verify-field small{display:block;opacity:.65;margin-bottom:5px}@media(max-width:600px){.verify-grid{grid-template-columns:1fr}}</style></head><body><main class="verify-wrap"><div class="verify-card"><img src="/voxel-veda-logo.png" alt="Voxel Veda" style="max-width:180px;height:auto"><h1>Employee Identity Verification</h1><div id="result" class="verify-status">Checking credential…</div><div id="details" class="verify-grid"></div><p style="margin-top:24px;opacity:.65">This page confirms current Voxel Veda employment credential status only. It does not expose private HR records.</p></div></main><script>const token=location.pathname.split('/').filter(Boolean).pop();const result=document.getElementById('result'),details=document.getElementById('details');fetch('/api/public/employee-id/'+encodeURIComponent(token)+'/verify').then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{const valid=ok&&data.verified;result.textContent=valid?'✓ Active Voxel Veda credential':'Credential not active';const e=data.employee||{};details.innerHTML=[['Employee',e.name],['Employee ID',e.employee_number],['Role',e.role],['Department',e.department],['Status',data.status],['Expiry',data.expires_at?new Date(data.expires_at).toLocaleDateString():'No expiry']].map(([k,v])=>'<div class="verify-field"><small>'+k+'</small>'+String(v||'—').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))+'</div>').join('')}).catch(()=>{result.textContent='Verification service unavailable'})</script></body></html>
