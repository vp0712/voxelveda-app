<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Account Security | Voxel Veda</title><link rel="stylesheet" href="/public-pages.css"><link rel="icon" href="/favicon.ico"></head><body><main class="public-shell"><section class="public-panel"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Security and sessions</h1><h2>Authenticator MFA</h2><p id="mfaStatus">Loading MFA status…</p><form id="mfaStartForm"><label>Current password<input id="mfaPassword" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Set up authenticator</button></form><section id="mfaSetup" hidden><img id="mfaQr" width="280" height="280" alt="Authenticator QR code"><label>Manual key<input id="mfaManual" readonly></label><form id="mfaConfirmForm"><label>Six-digit code<input id="mfaConfirmCode" inputmode="numeric" maxlength="6" required></label><button class="button" type="submit">Confirm MFA</button></form></section><section id="newRecovery" hidden><h3>Save these one-time recovery codes</h3><pre id="newRecoveryCodes"></pre></section><h3>Passkeys</h3><p>Passkeys are not enabled yet. WebAuthn server verification must be added and audited first.</p><h2>Change password</h2><form id="changePasswordForm"><label>Current password<input id="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" required minlength="14" autocomplete="new-password"></label><button class="button" type="submit">Change password</button></form><p id="status" role="status"></p><h2>Active sessions</h2><div id="sessions">Loading…</div><div class="hero-actions"><button class="button button-secondary" id="revokeOthers" type="button">Sign out other sessions</button><a class="button button-secondary" href="/">Return</a></div></section></main><script src="/security-page.js"></script></body></html>
