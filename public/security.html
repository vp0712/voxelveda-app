<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Account Security | Voxel Veda</title><link rel="stylesheet" href="/public-pages.css"><link rel="icon" href="/favicon.ico"></head><body><main class="public-shell"><section class="public-panel"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Security and sessions</h1><h2>Change password</h2><form id="changePasswordForm"><label>Current password<input id="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" required minlength="14" autocomplete="new-password"></label><button class="button" type="submit">Change password</button></form><p id="status" role="status"></p><h2>Active sessions</h2><div id="sessions">Loading…</div><div class="hero-actions"><button class="button button-secondary" id="revokeOthers" type="button">Sign out other sessions</button><a class="button button-secondary" href="/">Return</a></div></section></main><script src="/security-page.js"></script></body></html>
