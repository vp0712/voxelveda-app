<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Veda Attendance Gate</title>
<link rel="stylesheet" href="/style.css?v=20260725-qr-display-only" />
  <link rel="stylesheet" href="/advanced-theme.css?v=20260821-viewport-reliability" />
  <link rel="icon" type="image/png" href="/favicon.png?v=20260703-brand" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260703-brand" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260703-brand" />
  <link rel="manifest" href="/site.webmanifest?v=20260703-brand" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta property="og:site_name" content="Voxel Veda" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta property="og:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" /></head>
<body class="shift-terminal-page">
  <main class="shift-terminal-shell">
    <section class="shift-terminal-hero">
      <div class="terminal-brand-lockup">
        <img src="/Frame 1.png?v=20260703-brand" alt="Voxel Veda" />
        <div>
          <span>VOXEL VEDA</span>
          <strong>Attendance Gate</strong>
        </div>
      </div>
      <div class="terminal-status-pill">
        <span class="scan-live-dot"></span>
        <strong id="terminalStatus">Auto refresh</strong>
      </div>
    </section>

    <section class="shift-terminal-grid">
      <article class="terminal-qr-stage">
        <div class="terminal-qr-orbit" aria-hidden="true"></div>
        <div class="terminal-qr-frame">
          <img id="terminalQrImage" alt="Live shift QR code" />
        </div>
        <div class="terminal-countdown-ring">
          <span>Refresh</span>
          <strong id="terminalCountdown">20s</strong>
        </div>
      </article>
    </section>
  </main>
  <script src="/shift-qr-terminal.js?v=20260725-qr-display-only"></script>
</body>
</html>
