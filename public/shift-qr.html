<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voxel Veda Attendance</title><meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/attendance-gate.css">
</head><body class="attendance-gate-page">
<main class="attendance-gate">
<header class="gate-heading"><img src="/logo.png" alt="Voxel Veda"><h1>Voxel Veda Attendance</h1></header>
<p id="terminalSite" class="gate-site"></p>
<p class="gate-instruction">Open your staff portal and scan to check in or out.</p>
<div class="gate-code"><img id="terminalQrImage" alt="Current workplace attendance QR with the Voxel Veda logo" hidden></div>
<div class="gate-status" role="status"><span id="terminalStatus">Connecting…</span><span>Code expires in <strong id="terminalCountdown">—</strong></span></div>
<p id="terminalTokenState" class="gate-detail" role="status"></p>
<button id="terminalRetry" type="button">Refresh code</button>
<p class="gate-hint">Gate display · Scan from a separate device.</p>
</main><script src="/shift-qr-terminal.js"></script></body></html>
