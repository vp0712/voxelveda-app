<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Invoice PDF | Voxel Veda</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/workspace-theme.css?v=20261011-restored">
  <link rel="stylesheet" href="/style.css?v=20261011-restored">
  <script src="/workspace-theme.js?v=20261011-restored"></script>
  <style>
    main{width:min(1100px,calc(100% - 28px));margin:20px auto;padding-bottom:env(safe-area-inset-bottom)}
    header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .document-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-primary)}
    .document-brand img{width:58px;height:58px;object-fit:contain}.document-brand h1{font-size:22px;margin:0}
    .actions{display:flex;gap:10px;flex-wrap:wrap}iframe{width:100%;height:78dvh;min-height:420px;border:1px solid var(--border);background:#fff;border-radius:10px}
    #status{margin:12px 0;color:var(--text-secondary)}#status.error{color:var(--danger)}
    @media(max-width:600px){iframe{height:72dvh}header{align-items:flex-start}.actions{width:100%}}
  </style>
</head>
<body>
  <main>
    <header>
      <a class="document-brand" href="/dashboard"><img src="/Frame 1.png" alt="Voxel Veda"><h1>Invoice PDF</h1></a>
      <div class="actions"><button id="retry" class="secondary-btn" type="button" hidden>Retry generation</button><button id="download" class="primary-btn" type="button" disabled>Download PDF</button><a class="secondary-btn" href="/admin?view=invoices">Invoices</a></div>
    </header>
    <p id="status" role="status" aria-live="polite">Generating the official invoice PDF…</p>
    <iframe id="preview" title="Official invoice PDF preview" hidden></iframe>
  </main>
  <script src="/invoice-preview.js?v=20261011-restored"></script>
</body>
</html>
