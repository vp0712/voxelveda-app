<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice | Voxel Veda</title>
<link rel="stylesheet" href="/style.css?v=20260610-mobile-drawer-v3" />
  <style>
    .invoice-view-shell {
      min-height: 100vh;
      padding: 16px;
      display: grid;
      gap: 14px;
      background: linear-gradient(180deg, #07111f, #020617);
    }

    .invoice-view-top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(45, 212, 191, 0.22);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
    }

    .invoice-view-top h1 {
      margin: 0;
      font-size: 20px;
    }

    .invoice-view-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .invoice-document {
      width: min(920px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 20px;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .invoice-document-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      padding: 26px;
      background: #07111f;
      color: #ffffff;
      border-bottom: 4px solid #12b3c7;
    }

    .invoice-document-head img {
      width: 118px;
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    .invoice-title {
      text-align: right;
    }

    .invoice-title h2 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0;
    }

    .invoice-title p,
    .invoice-company p,
    .invoice-meta p,
    .invoice-bill p {
      margin: 4px 0;
    }

    .invoice-document-body {
      padding: 26px;
      display: grid;
      gap: 22px;
    }

    .invoice-info-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .invoice-panel {
      border: 1px solid #d7dee8;
      border-radius: 14px;
      padding: 16px;
      background: #f8fafc;
    }

    .invoice-panel h3 {
      margin: 0 0 10px;
      color: #0b4f6c;
      font-size: 13px;
      text-transform: uppercase;
    }

    .invoice-meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #e5eaf0;
    }

    .invoice-meta-row:last-child {
      border-bottom: 0;
    }

    .invoice-items {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
    }

    .invoice-items th {
      background: #07111f;
      color: #ffffff;
      border: 0;
      padding: 12px;
      font-size: 12px;
    }

    .invoice-items td {
      color: #0f172a;
      border-bottom: 1px solid #e5eaf0;
      padding: 12px;
    }

    .invoice-items td:nth-child(n+2),
    .invoice-items th:nth-child(n+2) {
      text-align: right;
    }

    .invoice-total-card {
      justify-self: end;
      width: min(320px, 100%);
      border: 1px solid #d7dee8;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
    }

    .invoice-total-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .invoice-total-row.final {
      background: #07111f;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
    }

    .invoice-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      color: #64748b;
      font-size: 13px;
    }

    .invoice-privacy-card {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 16px;
      align-items: center;
      border: 1px solid #d7dee8;
      border-radius: 14px;
      padding: 14px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
    }

    .invoice-privacy-card strong {
      color: #0b4f6c;
      display: block;
      margin-bottom: 4px;
    }

    .invoice-privacy-card img {
      width: 104px;
      height: 104px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #d7dee8;
      border-radius: 12px;
      padding: 8px;
    }

    .invoice-privacy-url {
      margin-top: 8px;
      color: #0b4f6c;
      font-size: 11px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .invoice-loading {
      padding: 28px;
      text-align: center;
      color: #cbd5e1;
      font-weight: 900;
    }

    @media (max-width: 700px) {
      .invoice-view-shell {
        padding: 10px;
      }

      .invoice-view-top,
      .invoice-document-head,
      .invoice-info-grid,
      .invoice-footer,
      .invoice-privacy-card {
        grid-template-columns: 1fr;
      }

      .invoice-view-top {
        align-items: stretch;
      }

      .invoice-view-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .invoice-title {
        text-align: left;
      }

      .invoice-title h2 {
        font-size: 28px;
      }

      .invoice-document-body,
      .invoice-document-head {
        padding: 18px;
      }

      .invoice-items thead {
        display: none;
      }

      .invoice-items,
      .invoice-items tbody,
      .invoice-items tr {
        display: block;
      }

      .invoice-items tr {
        border: 1px solid #e5eaf0;
        border-radius: 12px;
        margin-bottom: 10px;
        overflow: hidden;
      }

      .invoice-items td {
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
        text-align: left !important;
      }

      .invoice-items td::before {
        content: attr(data-label);
        color: #0b4f6c;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="/favicon.png?v=20260703-brand" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260703-brand" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260703-brand" />
  <link rel="manifest" href="/site.webmanifest?v=20260703-brand" />
  <meta name="theme-color" content="#22d3ee" />
  <meta property="og:site_name" content="Voxel Veda" />
  <meta property="og:image" content="https://voxelveda-app-production.up.railway.app/og-image.png?v=20260703-brand" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://voxelveda-app-production.up.railway.app/og-image.png?v=20260703-brand" /></head>
<body>
  <div class="invoice-view-shell">
    <header class="invoice-view-top">
      <div>
        <h1>Invoice Preview</h1>
        <p id="pdfStatus" class="muted-text">Loading invoice...</p>
      </div>
      <div class="invoice-view-actions">
        <button class="secondary-btn" type="button" onclick="goBack()">Back</button>
        <button class="primary-btn" type="button" onclick="openDirectPdf()">Open PDF</button>
        <button class="secondary-btn" type="button" onclick="downloadPdf()">Download PDF</button>
      </div>
    </header>

    <main id="invoicePreview" class="invoice-loading">Loading invoice preview...</main>
  </div>

  <script src="/qr-widget.js?v=20260609-gst-toggle"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get('id');
    const token = params.get('token') || localStorage.getItem('token') || '';
    const statusEl = document.getElementById('pdfStatus');
    const previewEl = document.getElementById('invoicePreview');

    function money(value) {
      return Number(value || 0).toLocaleString('en-AU', {
        style: 'currency',
        currency: 'AUD',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function pdfUrl(download = false) {
      const extra = download ? '&download=1' : '';
      return `/api/invoice/${encodeURIComponent(invoiceId)}/pdf?token=${encodeURIComponent(token)}${extra}`;
    }

    function detailUrl() {
      return `/api/invoice/${encodeURIComponent(invoiceId)}?token=${encodeURIComponent(token)}`;
    }

    function goBack() {
      if (history.length > 1) {
        history.back();
        return;
      }
      window.location.href = '/admin-dashboard.html';
    }

    function openDirectPdf() {
      window.location.href = pdfUrl(false);
    }

    function downloadPdf() {
      window.location.href = pdfUrl(true);
    }

    async function loadInvoicePreview() {
      if (!invoiceId || !token) {
        statusEl.textContent = 'Login again, then open the invoice.';
        previewEl.textContent = 'Invoice cannot load because the secure session is missing.';
        return;
      }

      const res = await fetch(detailUrl());
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        statusEl.textContent = data.message || 'Invoice failed to load';
        previewEl.textContent = data.message || 'Invoice failed to load.';
        return;
      }

      const invoice = data.invoice || {};
      const items = data.items?.length
        ? data.items
        : [{ description: invoice.description, quantity: invoice.quantity, unit_price: invoice.unit_price, amount: Number(invoice.quantity || 0) * Number(invoice.unit_price || 0) }];
      const gstRate = invoice.gst_rate === undefined || invoice.gst_rate === null || invoice.gst_rate === ''
        ? 10
        : Number(invoice.gst_rate);
      const subtotal = items.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const gst = subtotal * (gstRate / 100);
      const total = subtotal + gst;
      const invoiceDate = invoice.created_at ? new Date(invoice.created_at).toLocaleDateString('en-AU') : new Date().toLocaleDateString('en-AU');
      const dueDate = new Date(invoice.created_at || Date.now());
      dueDate.setDate(dueDate.getDate() + 7);

      statusEl.textContent = invoice.invoice_no || `Invoice #${invoiceId}`;

      previewEl.className = 'invoice-document';
      previewEl.innerHTML = `
        <section class="invoice-document-head">
          <div class="invoice-company">
            <img src="/Frame 1.png?v=20260703-brand" alt="Voxel Veda" />
            <p>Voxel Veda Pty Ltd</p>
            <p>Advanced manufacturing and engineering services</p>
          </div>
          <div class="invoice-title">
            <h2>INVOICE</h2>
            <p>Engineering Operations</p>
          </div>
        </section>
        <section class="invoice-document-body">
          <div class="invoice-info-grid">
            <div class="invoice-panel invoice-bill">
              <h3>Bill To</h3>
              <p><strong>${escapeHtml(invoice.customer_name || 'Customer')}</strong></p>
              <p>${escapeHtml(invoice.customer_email || '-')}</p>
            </div>
            <div class="invoice-panel invoice-meta">
              <h3>Invoice Details</h3>
              <div class="invoice-meta-row"><span>Invoice No</span><strong>${escapeHtml(invoice.invoice_no || `INV-${invoiceId}`)}</strong></div>
              <div class="invoice-meta-row"><span>Date</span><strong>${escapeHtml(invoiceDate)}</strong></div>
              <div class="invoice-meta-row"><span>Due Date</span><strong>${escapeHtml(dueDate.toLocaleDateString('en-AU'))}</strong></div>
            </div>
          </div>

          <table class="invoice-items">
            <thead>
              <tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr>
            </thead>
            <tbody>
              ${items.map((item) => `
                <tr>
                  <td data-label="Description">${escapeHtml(item.description || 'Item')}</td>
                  <td data-label="Qty">${escapeHtml(Number(item.quantity || 0))}</td>
                  <td data-label="Unit">${escapeHtml(money(item.unit_price))}</td>
                  <td data-label="Amount">${escapeHtml(money(item.amount))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="invoice-total-card">
            <div class="invoice-total-row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>
            <div class="invoice-total-row"><span>GST (${gstRate}%)</span><strong>${money(gst)}</strong></div>
            <div class="invoice-total-row final"><span>Total AUD</span><strong>${money(total)}</strong></div>
          </div>

          <div class="invoice-privacy-card">
            <div>
              <strong>Privacy, confidentiality & document handling</strong>
              <p>This invoice and any attached documents may contain confidential customer, supplier, pricing, production or payment information. Scan the QR code to view the live Voxel Veda privacy policy.</p>
              <p class="invoice-privacy-url">voxelveda-app-production.up.railway.app/privacy-policy.html</p>
            </div>
            <img src="/privacy-qr.png?v=20260608-local-qr" alt="Privacy Policy QR Code" />
          </div>

          <div class="invoice-footer">
            <div>
              <strong>Payment details</strong>
              <p>Bank: Commonwealth Bank</p>
              <p>Account name: Voxel Veda Pty Ltd</p>
              <p>BSB / Account: Add your details</p>
              <p>Reference: ${escapeHtml(invoice.invoice_no || `INV-${invoiceId}`)}</p>
            </div>
            <div>
              <strong>Authorized Signatory</strong>
              <p>Voxel Veda Pty Ltd</p>
            </div>
          </div>
        </section>
      `;
    }

    loadInvoicePreview().catch((err) => {
      console.error(err);
      statusEl.textContent = 'Invoice failed to load';
      previewEl.textContent = 'Invoice failed to load.';
    });
  </script>
</body>
</html>
