<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Customer Account | Voxel Veda</title>
<link rel="stylesheet" href="/style.css?v=20260704-aurora-graphite" />
  <link rel="stylesheet" href="/auth-entry.css?v=20261009-teal" />
  <link rel="icon" type="image/png" href="/favicon.png?v=20260703-brand" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260703-brand" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260703-brand" />
  <link rel="manifest" href="/site.webmanifest?v=20260703-brand" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta property="og:site_name" content="Voxel Veda" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta property="og:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" /></head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo-box">
        <img src="/Frame 1.png?v=20260703-brand" alt="Voxel Veda Logo" class="login-logo" />
      </div>

      <h1>Create Customer Account</h1>
      <p class="login-footnote">Create a customer account to request quotes and manage your profile securely.</p>

      <div id="registerStatus" class="status" role="status" aria-live="polite"></div>

      <form id="registerForm">
      <div class="login-field">
        <label for="name">Full Name / Company Contact</label>
        <input id="name" type="text" placeholder="Enter your name" autocomplete="name" required />
      </div>

      <div class="login-field">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 14 characters" autocomplete="new-password" minlength="14" maxlength="256" required />
      </div>

      <label class="privacy-check register-privacy">
        <input id="privacyAccepted" type="checkbox" required />
        <span>I have read and accept the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
      </label>

      <button type="submit" id="registerButton" class="login-btn">Create Account</button>
      </form>

      <div class="portal-links">
        <a href="/login">Back to Login</a>
      </div>
      <footer class="login-footer-links" aria-label="Customer and privacy links">
        <a href="/request-quote">Customer RFQ</a><span aria-hidden="true">·</span><a href="/privacy">Privacy Policy</a>
      </footer>
    </section>
  </main>

  <script src="/register.js?v=20261008-customer-form"></script>
</body>
</html>
