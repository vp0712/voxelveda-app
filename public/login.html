<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Veda Secure Portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo-box">
        <img src="/Frame 1.png" alt="Voxel Veda Logo" class="login-logo" />
      </div>

      <h1>Voxel Veda Secure Portal</h1>
      <p>Engineering operations access for RFQs, invoices, staff tasks and timesheets.</p>

      <div id="loginStatus" class="status"></div>

      <div class="login-field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter authorised email"
          autocomplete="email"
        />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter secure password"
          autocomplete="current-password"
        />
      </div>

      <button type="button" class="login-btn" onclick="login()">Access Portal</button>

      <div class="portal-links">
        <a href="/customer.html">Customer RFQ</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
      </div>

      <p class="login-footnote">Role-based access | Admin | Staff | Operations</p>
    </section>
  </main>

  <script src="/login.js?v=20260522-session-fix"></script>
</body>
</html>
