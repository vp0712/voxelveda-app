<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Veda</title>
<link rel="stylesheet" href="/style.css?v=20260730-expense-access" />
  <link rel="stylesheet" href="/advanced-theme.css?v=20260824-mobile-shell-v4" />
  <link rel="icon" type="image/png" href="/favicon.png?v=20260703-brand" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260703-brand" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260703-brand" />
  <link rel="manifest" href="/site.webmanifest?v=20260703-brand" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta property="og:site_name" content="Voxel Veda" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta property="og:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" /></head>

<body class="login-page">
  <section class="vv-entry-sequence" aria-hidden="true">
    <div class="vv-entry-core">
      <span class="vv-entry-ring vv-entry-ring-one"></span>
      <span class="vv-entry-ring vv-entry-ring-two"></span>
      <img src="/Frame 1.png?v=20260703-brand" alt="" />
      <div class="vv-entry-scan"></div>
    </div>
    <div class="vv-entry-status">
      <span></span>
      <strong>Voxel Veda</strong>
    </div>
  </section>

  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo-box">
        <img src="/Frame 1.png?v=20260703-brand" alt="Voxel Veda Logo" class="login-logo" />
      </div>

      <h1>Voxel Veda</h1>

      <div id="loginStatus" class="status"></div>

      <div class="login-field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
        />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <button type="button" class="login-btn" onclick="login()">Open Workspace</button>

      <div class="portal-links">
        <a href="/forgot-password">Forgot password</a>
        <a href="/register">Create Customer Account</a>
        <a href="/request-quote">Customer RFQ</a>
        <a href="/privacy">Privacy Policy</a>
      </div>

      <p class="login-footnote">Built for controlled engineering production and daily operations.</p>
    </section>
  </main>

  <script src="/login.js?v=20260729-entry-sequence"></script>
</body>
</html>
