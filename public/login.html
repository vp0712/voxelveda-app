<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Veda</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20260601-new-logo" />
  <link rel="stylesheet" href="/style.css?v=20260529-mobile-futuristic" />
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo-box">
        <img src="/Frame 1.png?v=20260601-new-logo" alt="Voxel Veda Logo" class="login-logo" />
      </div>

      <h1>Voxel Veda</h1>

      <div id="loginStatus" class="status"></div>

      <div class="login-field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
        />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <button type="button" class="login-btn" onclick="login()">Open Workspace</button>

      <div class="portal-links">
        <a href="/customer.html">Customer RFQ</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
      </div>

      <p class="login-footnote">Built for controlled engineering production and daily operations.</p>
    </section>
  </main>

  <script src="/login.js?v=20260525-login-simple"></script>
</body>
</html>
