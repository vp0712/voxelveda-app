<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in | Voxel Veda</title>
  <link rel="stylesheet" href="/style.css?v=20260730-expense-access" />
  <link rel="stylesheet" href="/auth-entry.css?v=20261009-navy-blue" />
  <link rel="stylesheet" href="/app-entry-design.css" />
  <link rel="icon" type="image/png" href="/favicon.png?v=20260703-brand" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260703-brand" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260703-brand" />
  <link rel="manifest" href="/site.webmanifest?v=20261009-navy-blue" />
  <meta name="theme-color" content="#F7F8FA" />
  <meta property="og:site_name" content="Voxel Veda" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta property="og:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://app.voxelveda.com/og-image.png?v=20260703-brand" /></head>

<body class="login-page vv-sign-in" data-vv-entry-surface="sign-in">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="vv-entry-art">
        <img class="vv-entry-illustration" src="/images/vv-scan-illustration.webp" alt="" fetchpriority="high" />
        <img class="vv-entry-logo" src="/logo.png" alt="Voxel Veda" width="68" height="68" />
      </div>
      <div class="vv-entry-form">
        <h1 id="loginTitle">Sign in</h1>
        <p class="vv-entry-intro">Use your Voxel Veda account to open your workspace.</p>

        <div id="loginStatus" class="status" role="status" aria-live="polite"></div>

        <form method="post" action="/api/auth/login" id="loginForm" novalidate>
          <div class="login-field">
            <label for="email">Work email or user ID</label>
            <input type="text" id="email" placeholder="Enter work email or user ID"
              autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="login-field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password"
              autocomplete="current-password" required />
          </div>

          <div class="vv-entry-recovery"><a href="/forgot-password">Forgot password?</a></div>
          <button type="submit" id="loginButton" disabled class="login-btn">Sign In</button>
        </form>

        <p class="login-register-prompt">New to Voxel Veda? <a href="/register">Create an account</a></p>
        <div data-device-notices-entry></div>
        <footer class="login-footer-links" aria-label="Privacy and support links">
          <a href="/privacy">Privacy Policy</a><span aria-hidden="true">·</span><a href="/terms">Terms</a><span aria-hidden="true">·</span><a href="/support">Support</a>
        </footer>
      </div>
    </section>
  </main>

  <script src="/login.js?v=20260909-secure-session-v2"></script>
</body>
</html>
