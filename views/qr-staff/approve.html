<!doctype html>
<html lang="en-AU">
<head>

  <meta name="referrer" content="no-referrer">

  <title>Link attendance phone · Voxel Veda</title>

<body>
  <main>
    <header><img src="/logo.png" alt="Voxel Veda" width="64" height="64"><h1>Staff attendance</h1></header>

      <h2 id="title">Link this phone</h2>
