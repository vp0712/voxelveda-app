name: Global Original Logo Branding

on:
  pull_request:
    paths:
      - 'app.js'
      - 'services/adminPageRenderer.js'
      - 'services/globalBrandRenderer.js'
      - 'public/global-brand.css'
      - 'public/global-brand.js'
      - 'public/logo.png'
      - 'public/voxel-veda-logo.png'
      - 'public/Frame 1.png'
      - 'public/og-image.png'
      - 'scripts/global-brand-original-logo-test.js'
      - '.github/workflows/global-brand-original-logo.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'services/adminPageRenderer.js'
      - 'services/globalBrandRenderer.js'
      - 'public/global-brand.css'
      - 'public/global-brand.js'
      - 'public/logo.png'
      - 'public/voxel-veda-logo.png'
      - 'public/Frame 1.png'
      - 'public/og-image.png'
      - 'scripts/global-brand-original-logo-test.js'
      - '.github/workflows/global-brand-original-logo.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check app.js
          node --check services/adminPageRenderer.js
          node --check services/globalBrandRenderer.js
          node --check public/global-brand.js
      - name: Original logo and global branding contracts
        run: node scripts/global-brand-original-logo-test.js
      - name: Whole-system regression audit
        run: node scripts/final-system-audit.js
