name: Application Release Candidate CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'simplify-*']
permissions:
  contents: read
concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install bounded local OCR tools for real scanned-input fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils util-linux
      - name: Production application build and retained regression gate
        run: npm run build
      - name: Run the complete build with production HTTPS enforcement
        env:
          NODE_ENV: production
          MALWARE_SCANNER_REQUIRED: 'true'
          OBJECT_STORAGE_PROVIDER: s3
        run: npm run build
      - name: Build the packaged source without Git metadata
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vv-source-artifact"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vv-source-artifact"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/vv-source-artifact/node_modules"
          cd "$RUNNER_TEMP/vv-source-artifact"
          npm run build
      - name: Verify the WordPress receiver with its real PDF parser and MIME builder
        run: |
          composer install --working-dir=deployment/wordpress --classmap-authoritative --no-interaction
          PDF_FIXTURE_PATH=/tmp/voxel-pdf-evidence/invoice.pdf php scripts/wordpress-pdf-relay-test.php
      - name: Install isolated browser verification tooling
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/vv-browser" --no-package-lock --ignore-scripts playwright@1.64.0
          "$RUNNER_TEMP/vv-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify visible attendance ticking, breaks, resume and delayed staff workflows
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/attendance-workflow-proof
        run: |
          node scripts/attendance-live-browser-test.js
          VV_ATTENDANCE_WORKFLOW_PROOF=after node scripts/restored-ui-browser-test.js
      - name: Verify checkout summary options, history and recovery in responsive browsers
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/attendance-workflow-proof/checkout-summary
        run: node scripts/checkout-summary-browser-test.js
      - name: Test weekly delivery and every retained role portal
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/attendance-workflow-proof/weekly-portals
        run: node scripts/weekly-portals-browser-test.js
      - name: Test explicit action outcomes and foreground dialogs across retained roles
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/attendance-workflow-proof/action-dialogs
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/action-dialog-browser-test.js
      - name: Verify foreground feedback and responsive actions with WebKit
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          VV_ACTION_BROWSER_ENGINE: webkit
          UI_PROOF_DIR: ${{ runner.temp }}/attendance-workflow-proof/action-dialogs-webkit
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/action-dialog-browser-test.js
      - name: Preserve attendance workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-workflows-${{ github.sha }}
          path: ${{ runner.temp }}/attendance-workflow-proof
          retention-days: 30
      - name: Test retained account pages in phone, tablet and desktop browsers
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          VV_PROOF_DIR: ${{ runner.temp }}/account-foundation-proof
        run: node scripts/account-foundation-browser-test.js
      - name: Test restored operational pages and saved workflows in responsive browsers
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/restored-application-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/restored-ui-browser-test.js
      - name: Verify populated invoice cards, values, seven widths and controlled workflows
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          VV_RESPONSIVE_MATRIX: after
          UI_PROOF_DIR: ${{ runner.temp }}/responsive-invoice-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/restored-ui-browser-test.js
      - name: Preserve responsive invoice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-invoices-${{ github.sha }}
          path: ${{ runner.temp }}/responsive-invoice-proof
          retention-days: 30
      - name: Verify invoice review, structured views, one Close, discard and document versions
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          VV_INVOICE_DETAIL_PROOF: after
          UI_PROOF_DIR: ${{ runner.temp }}/invoice-dialog-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/restored-ui-browser-test.js
      - name: Preserve invoice and shared dialog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-dialogs-${{ github.sha }}
          path: ${{ runner.temp }}/invoice-dialog-proof
          retention-days: 30
      - name: Test procurement import, records, reports and private source workflows in responsive browsers
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          PROCUREMENT_PROOF_DIR: ${{ runner.temp }}/procurement-import-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/procurement-import-browser-test.js
      - name: Preserve procurement workflow browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-browser-${{ github.sha }}
          path: ${{ runner.temp }}/procurement-import-proof
          retention-days: 30
      - name: Test staff attendance, avatars and notifications with before/after responsive evidence
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          UI_PROOF_DIR: ${{ runner.temp }}/staff-mobile-proof
        run: timeout --signal=TERM --kill-after=10s 360s node scripts/staff-mobile-browser-test.js
      - name: Decode the actual branded attendance gate through rotation, outage and responsive layouts
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          GATE_PROOF_DIR: ${{ runner.temp }}/attendance-gate-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/attendance-gate-browser-test.js
      - name: Verify independent QR display, cookie-free access, rotation and revocation
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          DISPLAY_PROOF_DIR: ${{ runner.temp }}/attendance-display-proof
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/attendance-display-browser-test.js
      - name: Preserve scoped display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-display-${{ github.sha }}
          path: ${{ runner.temp }}/attendance-display-proof
          retention-days: 30
      - name: Preserve branded gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-gate-browser-${{ github.sha }}
          path: ${{ runner.temp }}/attendance-gate-proof
          retention-days: 30
      - name: Preserve staff mobile before/after browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-mobile-browser-${{ github.sha }}
          path: ${{ runner.temp }}/staff-mobile-proof
          retention-days: 30
      - name: Preserve actual browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-${{ github.sha }}
          path: ${{ runner.temp }}/account-foundation-proof
          retention-days: 30
      - name: Preserve restored workflow browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-browser-${{ github.sha }}
          path: ${{ runner.temp }}/restored-application-proof
          retention-days: 30
      - name: Verify release marker is separate from candidate changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx '.railway-release'; then
            echo "::error::.railway-release must only be changed after the candidate has passed CI and merged."
            exit 1
          fi
          echo "Application candidate passed without prematurely triggering Railway production."
