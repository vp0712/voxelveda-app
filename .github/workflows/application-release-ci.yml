name: Application Release Candidate CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'simplify-*']
permissions:
  contents: read
concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Production application build and retained regression gate
        run: npm run build
      - name: Run the complete build with production HTTPS enforcement
        env:
          NODE_ENV: production
        run: npm run build
      - name: Build the packaged source without Git metadata
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vv-source-artifact"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/vv-source-artifact"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/vv-source-artifact/node_modules"
          cd "$RUNNER_TEMP/vv-source-artifact"
          npm run build
      - name: Install isolated browser verification tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/vv-browser" --no-package-lock --ignore-scripts playwright@1.64.0
          "$RUNNER_TEMP/vv-browser/node_modules/.bin/playwright" install chromium
      - name: Test retained account pages in phone, tablet and desktop browsers
        env:
          VV_BROWSER_MODULE_PATH: ${{ runner.temp }}/vv-browser/node_modules/playwright
          VV_PROOF_DIR: ${{ runner.temp }}/account-foundation-proof
        run: node scripts/account-foundation-browser-test.js
      - name: Preserve actual browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-${{ github.sha }}
          path: ${{ runner.temp }}/account-foundation-proof
          retention-days: 30
      - name: Verify release marker is separate from candidate changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx '.railway-release'; then
            echo "::error::.railway-release must only be changed after the candidate has passed CI and merged."
            exit 1
          fi
          echo "Application candidate passed without prematurely triggering Railway production."
