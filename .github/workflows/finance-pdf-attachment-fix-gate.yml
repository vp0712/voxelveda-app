name: Finance PDF Attachment Fix Gate
on:
  push:
    branches: [fix/finance-pdf-real-attachment-20261002]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/finance-email-pdf-delivery-test.js
      - run: npm run build
