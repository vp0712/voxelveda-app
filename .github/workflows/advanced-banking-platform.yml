name: Advanced Australian Banking Platform

on:
  pull_request:
    paths:
      - 'migrations/20260918_advanced_au_banking_platform.sql'
      - 'services/openBankingProviderService.js'
      - 'services/advancedBankingSyncService.js'
      - 'services/bankSyncScheduler.js'
      - 'controllers/openBankingController.js'
      - 'controllers/advancedBankingController.js'
      - 'routes/advancedBankingRoutes.js'
      - 'routes/integrationWebhookRoutes.js'
      - 'middleware/statementPreviewSanitizer.js'
      - 'config/permissionCatalog.js'
      - 'public/admin-dashboard.html'
      - 'public/admin-dashboard.js'
      - 'public/advanced-theme.css'
      - 'app.js'
      - 'migrations/20260918_premium_banking_budgets.sql'
      - 'migrations/20260918_banking_os_multi_user.sql'
      - 'controllers/bankingOperatingSystemController.js'
      - 'scripts/banking-os-multi-user-test.js'
      - 'scripts/banking-command-center-test.js'
      - 'scripts/standalone-banking-portal-test.js'
      - 'scripts/multibank-statement-history-test.js'
      - 'scripts/statement-first-money-warehouse-test.js'
      - 'scripts/print-save-pdf-test.js'
      - 'scripts/statement-data-controls-test.js'
      - 'scripts/banking-workspace-error-recovery-test.js'
      - 'scripts/access-update-actions-test.js'
      - 'scripts/banking-account-scope-test.js'
      - 'routes/bankingPortalRoutes.js'
      - 'controllers/statementImportController.js'
      - 'public/finance-statement-report-center.js'
      - 'public/finance-master.js'\n      - 'public/finance-master.css'\n      - 'public/finance-intelligence.html'\n      - 'controllers/financeIntelligenceController.js'
      - 'routes/financeRoutes.js'
      - 'public/finance-pdf-v3.js'
      - 'services/globalBrandRenderer.js'
      - 'scripts/advanced-banking-platform-test.js'
      - '.github/workflows/advanced-banking-platform.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/20260918_advanced_au_banking_platform.sql'
      - 'services/openBankingProviderService.js'
      - 'services/advancedBankingSyncService.js'
      - 'services/bankSyncScheduler.js'
      - 'controllers/openBankingController.js'
      - 'controllers/advancedBankingController.js'
      - 'routes/advancedBankingRoutes.js'
      - 'routes/integrationWebhookRoutes.js'
      - 'middleware/statementPreviewSanitizer.js'
      - 'config/permissionCatalog.js'
      - 'public/admin-dashboard.html'
      - 'public/admin-dashboard.js'
      - 'public/advanced-theme.css'
      - 'app.js'
      - 'migrations/20260918_premium_banking_budgets.sql'
      - 'migrations/20260918_banking_os_multi_user.sql'
      - 'controllers/bankingOperatingSystemController.js'
      - 'scripts/banking-os-multi-user-test.js'
      - 'controllers/financeIntelligenceController.js'
      - 'routes/financeRoutes.js'
      - 'public/finance-pdf-v3.js'
      - 'services/globalBrandRenderer.js'
      - 'scripts/advanced-banking-platform-test.js'

jobs:
  banking-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check services/openBankingProviderService.js
          node --check services/advancedBankingSyncService.js
          node --check services/bankSyncScheduler.js
          node --check controllers/openBankingController.js
          node --check controllers/advancedBankingController.js
          node --check controllers/bankingOperatingSystemController.js
          node --check routes/advancedBankingRoutes.js
          node --check routes/integrationWebhookRoutes.js
          node --check middleware/statementPreviewSanitizer.js
          node --check public/admin-dashboard.js
          node --check public/finance-pdf-v3.js
          node --check public/finance-master.js
          node --check scripts/advanced-banking-platform-test.js
          node --check scripts/banking-os-multi-user-test.js
          node --check scripts/banking-command-center-test.js
          node --check scripts/standalone-banking-portal-test.js
          node --check scripts/multibank-statement-history-test.js
          node --check scripts/statement-first-money-warehouse-test.js
          node --check scripts/print-save-pdf-test.js
          node --check scripts/statement-data-controls-test.js
          node --check scripts/banking-workspace-error-recovery-test.js
          node --check scripts/access-update-actions-test.js
          node --check scripts/banking-account-scope-test.js
          node --check services/financePrivacyService.js
          node --check middleware/financePrivacyMiddleware.js
          node --check public/admin-dashboard.js
          node --check services/bankSyncScheduler.js
          node --check controllers/advancedBankingController.js
          node --check controllers/statementDataManagementController.js
          node --check controllers/statementImportController.js
          node --check public/finance-statement-report-center.js
          node --check routes/bankingPortalRoutes.js
      - name: Architecture and security contract
        run: node scripts/advanced-banking-platform-test.js
      - name: Banking OS multi-user security contract
        run: node scripts/banking-os-multi-user-test.js
      - name: Banking command centre regression contract
        run: node scripts/banking-command-center-test.js
      - name: Standalone banking portal access contract
        run: node scripts/standalone-banking-portal-test.js
      - name: Multi-bank statement history contract
        run: node scripts/multibank-statement-history-test.js
      - name: Statement-first money warehouse contract
        run: node scripts/statement-first-money-warehouse-test.js
      - name: Print Save PDF regression contract
        run: node scripts/print-save-pdf-test.js
      - name: Statement data controls regression contract
        run: node scripts/statement-data-controls-test.js
      - name: Banking workspace error recovery contract
        run: node scripts/banking-workspace-error-recovery-test.js
      - name: Access update and scheduler regression contract
        run: node scripts/access-update-actions-test.js
      - name: Delegated Banking account-scope regression contract
        run: node scripts/banking-account-scope-test.js
      - name: Existing statement-review safety contract
        run: node scripts/finance-statement-review-test.js
