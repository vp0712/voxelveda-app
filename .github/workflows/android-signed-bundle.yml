name: Prepare existing-identity signed Android bundle
run-name: Inspect existing Android release access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-access:
    name: Inspect existing release bindings without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Report only binding availability and the public upload certificate
        shell: python
        run: |
          import os,json,pathlib,tempfile,base64,subprocess,re
          names=['ANDROID_UPLOAD_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD','GOOGLE_PLAY_SERVICE_ACCOUNT_JSON']
          present={name:bool(os.environ.get(name)) for name in names}
          report={'packageId':'com.voxelveda.app','testedApplicationCommit':'9dde6da30685722f3a64fdb64331fc96ac232d35','auditCommit':os.environ['GITHUB_SHA'],'bindingsAvailableToThisWorkflow':present,'privateTracksQueried':False,'bundleBuilt':False,'playUploadPerformed':False,'playReleasePerformed':False}
          if all(present[name] for name in names[:4]):
              try:
                  with tempfile.TemporaryDirectory() as temp:
                      path=pathlib.Path(temp)/'existing-upload-key.jks'
                      path.write_bytes(base64.b64decode(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'],validate=True))
                      path.chmod(0o600)
                      result=subprocess.run(['keytool','-list','-v','-keystore',str(path),'-alias',os.environ['ANDROID_KEY_ALIAS'],'-storepass:env','ANDROID_KEYSTORE_PASSWORD'],capture_output=True,text=True)
                      match=re.search(r'SHA256:\s*([0-9A-Fa-f:]{95})',result.stdout)
                      report['boundUploadCertificateReadable']=result.returncode==0 and bool(match)
                      if match: report['boundUploadCertificateSha256']=match.group(1).upper()
              except Exception:
                  report['boundUploadCertificateReadable']=False
          else:
              report['boundUploadCertificateReadable']=False
          report['playConsoleUploadIdentityVerified']=False
          report['playAppSigningIdentityVerified']=False
          report['missingBindings']=[name for name,available in present.items() if not available]
          text=json.dumps(report,indent=2)
          pathlib.Path('android-release-access.json').write_text(text+'\n')
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('### Existing Android release access\n\n```json\n'+text+'\n```\n')
          print(text)
      - name: Preserve public availability report
        uses: actions/upload-artifact@v4
        with:
          name: android-release-access
          path: android-release-access.json
          retention-days: 14
      - name: Require the release bindings before continuing
        shell: python
        run: |
          import json
          report=json.load(open('android-release-access.json'))
          if report['missingBindings']:
              raise SystemExit('Missing secure release bindings: '+', '.join(report['missingBindings']))
          if not report['boundUploadCertificateReadable']:
              raise SystemExit('The existing bound upload certificate could not be verified.')
