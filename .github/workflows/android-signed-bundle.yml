name: Prepare existing-identity signed Android bundle
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code greater than the verified highest code in the existing Play listing
        required: true
        type: string
      version_name:
        description: Approved Android release version name
        required: true
        type: string
      verified_play_max_code:
        description: Highest existing Play version code verified by the release owner
        required: true
        type: string
      upload_certificate_sha256:
        description: Existing upload certificate SHA256 from the authorised signing record
        required: true
        type: string
      app_signing_sha256:
        description: Actual Play App Signing certificate SHA256, not the upload key
        required: true
        type: string
permissions:
  contents: read
  checks: read
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_PLAY_MAX_VERSION_CODE: ${{ inputs.verified_play_max_code }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ inputs.upload_certificate_sha256 }}
      ANDROID_APP_SIGNING_SHA256: ${{ inputs.app_signing_sha256 }}
      ANDROID_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the checked main source and existing secure signing capability
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ANDROID_CHECKED_SOURCE="$GITHUB_SHA"
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx '.railway-release'; then
            test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | wc -l)" -eq 1
            ANDROID_CHECKED_SOURCE=$(sed -n 's/^merged-commit: //p' .railway-release)
            test -n "$ANDROID_CHECKED_SOURCE"
            test -z "$(git diff --name-only "$ANDROID_CHECKED_SOURCE" "$GITHUB_SHA" -- . ':!.railway-release')"
          fi
          printf 'ANDROID_SOURCE_COMMIT=%s\n' "$ANDROID_CHECKED_SOURCE" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/commits/$ANDROID_CHECKED_SOURCE/check-runs?per_page=100" > "$RUNNER_TEMP/android-source-checks.json"
          node -e 'const c=require(process.env.RUNNER_TEMP+"/android-source-checks.json").check_runs;for(const n of ["application-release","mysql-regression","android-installed","Security checks and tests"]){if(!c.some(r=>r.name===n&&r.status==="completed"&&r.conclusion==="success"))throw Error("Required checked source missing: "+n)}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci --ignore-scripts
      - name: Verify the published association uses the actual App Signing identity
        run: |
          curl --fail --silent --show-error https://app.voxelveda.com/.well-known/assetlinks.json --output "$RUNNER_TEMP/android-live-association.json"
          node -e 'const rows=require(process.env.RUNNER_TEMP+"/android-live-association.json");if(!rows.some(r=>r.target?.package_name==="com.voxelveda.app"&&r.target.sha256_cert_fingerprints?.includes(process.env.ANDROID_APP_SIGNING_SHA256.toUpperCase())))throw Error("Live App Signing association is not verified")'
      - name: Synchronise and sign using the existing upload key without exporting credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/existing-upload-key.jks"
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          npx cap sync android
          android/gradlew -p android --no-daemon :app:bundleRelease
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Preserve signed bundle for the existing authorised Play testing process
        uses: actions/upload-artifact@v4
        with:
          name: existing-app-signed-bundle-${{ inputs.version_code }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
# This workflow prepares a verified bundle. It does not upload to or publish on Play.
# Publisher access, the existing track and uploaded version must be verified separately.
