name: Prepare or explicitly publish existing-identity Android bundle
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code greater than the verified highest code in the existing Play listing
        required: true
        type: string
      version_name:
        description: Approved Android release version name
        required: true
        type: string
      verified_play_max_code:
        description: Highest existing Play version code verified by the release owner
        required: true
        type: string
      upload_certificate_sha256:
        description: Existing upload certificate SHA256 from the authorised signing record
        required: true
        type: string
      app_signing_sha256:
        description: Actual Play App Signing certificate SHA256, not the upload key
        required: true
        type: string
      play_intent:
        description: Artifact only by default; other choices explicitly submit a Play edit
        required: true
        type: choice
        default: artifact-only
        options: [artifact-only, draft, internal, production]
      play_track:
        description: Exact existing Play track, required only for a Play submission
        required: false
        type: string
      play_release_status:
        description: Draft preserves availability; completed submits the selected internal/production release
        required: true
        type: choice
        default: draft
        options: [draft, completed]
permissions:
  contents: read
  checks: read
concurrency:
  group: existing-identity-android-release
  cancel-in-progress: false
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_PLAY_MAX_VERSION_CODE: ${{ inputs.verified_play_max_code }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ inputs.upload_certificate_sha256 }}
      ANDROID_APP_SIGNING_SHA256: ${{ inputs.app_signing_sha256 }}
      ANDROID_SOURCE_COMMIT: ${{ github.sha }}
      PLAY_RELEASE_INTENT: ${{ inputs.play_intent }}
      PLAY_TRACK: ${{ inputs.play_track }}
      PLAY_RELEASE_STATUS: ${{ inputs.play_release_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the checked main source and existing secure signing capability
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ANDROID_CHECKED_SOURCE="$GITHUB_SHA"
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx '.railway-release'; then
            test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | wc -l)" -eq 1
            ANDROID_CHECKED_SOURCE=$(sed -n 's/^merged-commit: //p' .railway-release)
            test -n "$ANDROID_CHECKED_SOURCE"
            test -z "$(git diff --name-only "$ANDROID_CHECKED_SOURCE" "$GITHUB_SHA" -- . ':!.railway-release')"
          fi
          printf 'ANDROID_SOURCE_COMMIT=%s\n' "$ANDROID_CHECKED_SOURCE" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/commits/$ANDROID_CHECKED_SOURCE/check-runs?per_page=100" > "$RUNNER_TEMP/android-source-checks.json"
          node -e 'const c=require(process.env.RUNNER_TEMP+"/android-source-checks.json").check_runs;for(const n of ["application-release","mysql-regression","android-installed","current-preservation","Security checks and tests"]){if(!c.some(r=>r.name===n&&r.status==="completed"&&r.conclusion==="success"))throw Error("Required checked source missing: "+n)}'
      - name: Validate explicit publishing intent and existing publisher capability
        if: inputs.play_intent != 'artifact-only'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          node -e 'const {configuration}=require("./scripts/android-play-publish");configuration({intent:process.env.PLAY_RELEASE_INTENT,track:process.env.PLAY_TRACK,status:process.env.PLAY_RELEASE_STATUS,versionCode:process.env.ANDROID_VERSION_CODE,versionName:process.env.ANDROID_VERSION_NAME,verifiedMax:process.env.ANDROID_PLAY_MAX_VERSION_CODE,sourceCommit:process.env.ANDROID_SOURCE_COMMIT,event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF});let a;try{a=JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON||"")}catch(_){throw Error("The existing secure Google Play service account is not configured")}if(a.type!=="service_account"||!a.client_email||!a.private_key)throw Error("The existing secure publisher binding is incomplete");console.log("Explicit Play intent and secure service-account shape verified; credentials are not printed.")'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci --ignore-scripts
      - name: Verify the published association uses the actual App Signing identity
        run: |
          curl --fail --silent --show-error https://app.voxelveda.com/.well-known/assetlinks.json --output "$RUNNER_TEMP/android-live-association.json"
          node -e 'const rows=require(process.env.RUNNER_TEMP+"/android-live-association.json");if(!Array.isArray(rows)||!rows.some(r=>r.relation?.includes("delegate_permission/common.handle_all_urls")&&r.target?.namespace==="android_app"&&r.target.package_name==="com.voxelveda.app"&&r.target.sha256_cert_fingerprints?.includes(process.env.ANDROID_APP_SIGNING_SHA256.toUpperCase())))throw Error("Live App Signing association is not verified")'
      - name: Synchronise and sign using the existing upload key without exporting credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/existing-upload-key.jks"
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          npx cap sync android
          android/gradlew -p android --no-daemon :app:bundleRelease
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Preserve signed bundle for the existing authorised Play testing process
        uses: actions/upload-artifact@v4
        with:
          name: existing-app-signed-bundle-${{ inputs.version_code }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Refuse a publishing dispatch superseded by newer main work
        if: inputs.play_intent != 'artifact-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$CURRENT_MAIN_SHA" = "$GITHUB_SHA"
      - name: Obtain short-lived access for the existing Google Play publisher
        if: inputs.play_intent != 'artifact-only'
        id: play-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Query existing Play state, upload and submit one transactional edit
        if: inputs.play_intent != 'artifact-only'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
        run: node scripts/android-play-publish.js --bundle android/app/build/outputs/bundle/release/app-release.aab --evidence "$RUNNER_TEMP/android-play-result.json"
      - name: Retain provider outcome without claiming store availability or installed delivery
        if: always() && inputs.play_intent != 'artifact-only'
        uses: actions/upload-artifact@v4
        with:
          name: existing-app-play-result-${{ inputs.version_code }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-play-result.json
          if-no-files-found: warn
          retention-days: 30
# Artifact-only is the default and never authenticates to Play. Publishing is an
# explicit manual action after checked-source/signing/live-association gates.
# A provider commit can still require review or other Play processing. Neither
# completed status nor an accepted commit establishes users received an update.
# Never rerun a failed publisher attempt: inspect the result/edit/track first.
