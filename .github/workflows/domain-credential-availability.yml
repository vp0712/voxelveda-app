name: Domain Credential Availability Diagnostic

on:
  push:
    branches:
      - diag/railway-domain-status-20261001
    paths:
      - '.github/workflows/domain-credential-availability.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RW_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RW_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RW_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          check(){ if [ -n "${!1:-}" ]; then echo "$1=present"; else echo "$1=absent"; fi; }
          check RW_TOKEN
          check RW_API_TOKEN
          check RW_PROJECT_TOKEN
          check HOSTINGER_API_TOKEN
          check HOSTINGER_TOKEN
