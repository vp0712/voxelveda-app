name: Enterprise Audit Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: enterprise-audit-evidence
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate architecture inventory for this exact commit
        run: node scripts/generate-enterprise-inventory.js

      - name: Update deep-audit baseline metadata in evidence workspace
        run: node scripts/update-enterprise-audit-baseline.js

      - name: Verify audit provenance
        run: node scripts/check-enterprise-audit-provenance.js

      - name: Write audit evidence manifest
        shell: bash
        run: |
          {
            echo "source_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > docs/ENTERPRISE_AUDIT_EVIDENCE.txt

      - name: Upload current enterprise audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-audit-${{ github.sha }}
          path: |
            docs/ENTERPRISE_ARCHITECTURE_INVENTORY.json
            docs/ENTERPRISE_DEEP_AUDIT.md
            docs/ENTERPRISE_AUDIT_EVIDENCE.txt
          retention-days: 90
