name: Enterprise Audit Refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enterprise-audit-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[audit refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate architecture inventory
        run: node scripts/generate-enterprise-inventory.js

      - name: Update deep-audit baseline metadata
        run: node scripts/update-enterprise-audit-baseline.js

      - name: Verify audit provenance
        run: node scripts/check-enterprise-audit-provenance.js

      - name: Open protected-main audit refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- docs/ENTERPRISE_ARCHITECTURE_INVENTORY.json docs/ENTERPRISE_DEEP_AUDIT.md; then
            echo "Audit evidence is already current."
            exit 0
          fi
          short_sha="${GITHUB_SHA::12}"
          branch="automation/audit-refresh-${short_sha}"
          git config user.name "voxelveda-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/ENTERPRISE_ARCHITECTURE_INVENTORY.json docs/ENTERPRISE_DEEP_AUDIT.md
          git commit -m "docs: refresh enterprise audit for ${short_sha} [audit refresh]"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            pr="$existing"
          else
            pr="$(gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$branch"               --title "docs: refresh enterprise audit for ${short_sha} [audit refresh]"               --body "Automated deterministic enterprise-audit refresh generated from main commit \`$GITHUB_SHA\`. No application code is changed."               --json number --jq '.number')"
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
