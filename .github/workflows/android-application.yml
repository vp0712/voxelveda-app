name: Android installed application verification
on:
  pull_request:
    branches: [main]
    paths: ['android/**', 'native-shell/**', 'capacitor.config.json', 'public/**', 'scripts/android-*', 'scripts/staff-mobile-browser-test.js', 'services/globalBrandRenderer.js', 'middleware/**', 'controllers/authController.js', 'controllers/mfaController.js', 'services/authSessionService.js', 'config/urls.js', '.github/workflows/android-application.yml']
  push:
    branches: [main, 'simplify-*']
    paths: ['android/**', 'native-shell/**', 'capacitor.config.json', 'public/**', 'scripts/android-*', 'scripts/staff-mobile-browser-test.js', 'services/globalBrandRenderer.js', 'middleware/**', 'controllers/authController.js', 'controllers/mfaController.js', 'services/authSessionService.js', 'config/urls.js', '.github/workflows/android-application.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-installed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-installed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_VERSION_CODE: '2'
      ANDROID_VERSION_NAME: '0.0.0-verification'
      ANDROID_SOURCE_COMMIT: ${{ github.sha }}
      VV_ANDROID_PROOF_DIR: /tmp/voxelveda-android-proof
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Record current existing-identity release binding availability without publishing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import os,json,pathlib,tempfile,base64,subprocess,re
          names=['ANDROID_UPLOAD_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD','GOOGLE_PLAY_SERVICE_ACCOUNT_JSON']
          present={name:bool(os.environ.get(name)) for name in names}
          report={'packageId':'com.voxelveda.app','candidateCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'scope':'Bindings available to this repository workflow; presence alone does not prove provider authorisation.','bindingsAvailableToThisWorkflow':present,'boundUploadCertificateReadable':False,'playAppSigningIdentityVerified':False,'privateTracksQueried':False,'bundleBuilt':False,'playUploadPerformed':False,'playReleasePerformed':False,'physicalDeviceTested':False}
          if all(present[name] for name in names[:4]):
              try:
                  with tempfile.TemporaryDirectory() as temp:
                      key=pathlib.Path(temp)/'existing-upload-key.jks'
                      key.write_bytes(base64.b64decode(os.environ[names[0]],validate=True))
                      key.chmod(0o600)
                      result=subprocess.run(['keytool','-list','-v','-keystore',str(key),'-alias',os.environ['ANDROID_KEY_ALIAS'],'-storepass:env','ANDROID_KEYSTORE_PASSWORD'],capture_output=True,text=True,timeout=30)
                      match=re.search(r'SHA256:\s*([0-9A-Fa-f:]{95})',result.stdout)
                      report['boundUploadCertificateReadable']=result.returncode==0 and bool(match)
                      if report['boundUploadCertificateReadable']: report['boundUploadCertificateSha256']=match.group(1).upper()
              except Exception:
                  report['boundUploadCertificateReadable']=False
          report['missingBindings']=[name for name,available in present.items() if not available]
          target=pathlib.Path(os.environ['VV_ANDROID_PROOF_DIR'])/'android-release-access.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci --ignore-scripts
      - name: Synchronise the actual native project and canonical bundled configuration
        run: npx cap sync android
      - name: Build installed verification artifacts and native policy tests
        run: android/gradlew -p android --no-daemon :app:assembleVerification :app:assembleVerificationAndroidTest :app:testVerificationUnitTest
      - name: Verify the actual APK identity, canonical bundled config and signature
        run: node scripts/android-artifact-metadata.js android/app/build/outputs/apk/verification/app-verification.apk /tmp/voxelveda-android-proof/artifact-before-upgrade.json
      - name: Make the disposable runner's Android virtualisation device accessible
        run: sudo chmod 666 /dev/kvm
      - name: Run real installed WebView authentication, navigation and upgrade journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/android-emulator-ci.sh
      - name: Preserve test artifacts and explicit signing/domain limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-only-${{ github.sha }}
          path: |
            /tmp/voxelveda-android-proof
            android/app/build/outputs/apk/verification/
            android/app/build/outputs/apk/androidTest/verification/
            android/app/build/test-results/
            android/app/build/reports/
          retention-days: 30
