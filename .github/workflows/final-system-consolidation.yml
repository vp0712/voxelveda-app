name: Final System Consolidation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-everything:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and all retained source contracts
        run: npm run check
      - name: Full application regression suite
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
